name: Test build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest]
        python-version: ['3.14']

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    # Required for miniconda to activate conda
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v6

      - name: Get micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: test-env
          init-shell: bash
          create-args: >-
            --strict-channel-priority
            conda-forge/label/python_rc::_python_rc
            python=${{ matrix.python-version }}

      - name: Set PYTHON_GIL=0 for free-threaded builds
        if: contains(matrix.python-version, 'python-freethreading')
        run: echo "PYTHON_GIL=0" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Check active Python version
        run: python -c "import sys; assert '.'.join(str(s) for s in sys.version_info[:2]) == '${{ matrix.python-version }}'.split()[0], f'{version} incorrect!'"

      - name: Install ROOT
        if: matrix.python-version == 3.10  &&  runner.os == 'Linux'
        run: |
          micromamba env list
          micromamba install root
          micromamba list

      - name: Install sshd for fsspec ssh tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openssh-server pkg-config uuid-dev
          sudo service ssh restart
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod og-wx ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no localhost echo "ssh connection successful"

      - name: Install XRootD
        if: runner.os != 'Windows'
        run: |
          micromamba env list
          micromamba install xrootd
          micromamba list

      - name: Install native XRootD fsspec backend
        if: runner.os != 'Windows'
        run: |
          uv pip install --system "xrootd[fsspec] @ git+https://github.com/lobis/xrootd.git@codex/native-fsspec-root"
          python - <<'PY'
          import fsspec
          import XRootD
          import XRootD.fsspec

          assert fsspec.get_filesystem_class("root") is XRootD.fsspec.XRootDFileSystem
          assert fsspec.get_filesystem_class("xroot") is XRootD.fsspec.XRootDFileSystem
          assert fsspec.get_filesystem_class("roots") is XRootD.fsspec.XRootDFileSystem
          assert fsspec.get_filesystem_class("xroots") is XRootD.fsspec.XRootDFileSystem
          PY

      - name: Pip install the package
        run: uv pip install --system -e. --group=dev

      - name: Run pytest
        run: |
          python -m pytest -vv tests --reruns 10 --reruns-delay 30 --only-rerun "(?i)http|ssl|timeout|expired|connection|socket"

  pass:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
